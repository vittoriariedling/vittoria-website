#cloud-config
# Paste into DigitalOcean's "User data" box when creating the Droplet
# (Ubuntu 24.04 LTS). Also add your SSH key in the Droplet form.
#
# Result: a `deploy` user with your SSH key, root and password logins off,
# ufw + fail2ban, automatic security updates, Docker, a swap file, rclone and
# age (for backups). Takes a few minutes after the Droplet boots; check with
#   cloud-init status --wait

package_update: true
package_upgrade: true

apt:
  sources:
    docker.list:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - ufw
  - fail2ban
  - unattended-upgrades
  - rclone
  - age
  - git

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers deploy
      MaxAuthTries 3
      X11Forwarding no
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "5" },
        "live-restore": true
      }
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Give `deploy` the SSH key DigitalOcean put on root. Only lock root out
  # once that worked, so a mistake here can't lock you out entirely.
  - install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
  - install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - '[ -s /home/deploy/.ssh/authorized_keys ] || rm /etc/ssh/sshd_config.d/10-hardening.conf'
  - systemctl restart ssh
  # Firewall. Note: Docker-published ports bypass ufw, which is why only
  # Traefik publishes any (80/443). The DigitalOcean cloud firewall is the
  # main line of defence; ufw is a second layer.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw limit 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - systemctl restart docker
  # 2 GB swap so building the frontend doesn't run out of memory.
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - install -d -m 700 -o deploy -g deploy /home/deploy/backups
