# Local development overrides (merged automatically by `docker compose up`).

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, for psql / DB GUIs
    volumes:
      - ./api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  api:
    build:
      args:
        INSTALL_DEV: "true"
    environment:
      ENVIRONMENT: dev
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/app_test
      S3_ENDPOINT_URL: http://storage:8333    # how the API reaches storage
      S3_PUBLIC_URL: http://localhost:8333    # how browsers reach it (signed photo URLs)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app
      # Your private content (gitignored), read-only, for `python -m app.importer`.
      - ./client/src/assets:/import/assets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      storage:
        condition: service_started

  # Local S3-compatible object storage for photos (production will use Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec /entrypoint.sh server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
        -s3 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - storage_data:/data
    ports:
      - "127.0.0.1:8333:8333"

  web:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"   # file watching through Windows bind mounts
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  storage_data:
  web_node_modules:
